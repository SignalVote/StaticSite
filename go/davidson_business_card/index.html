<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Redirecting</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://a3quumsolutions.com/davidson/" />
<!--
  Short link printed as the QR on Bradley Davidson's A3Q business card
  (Link Builder row: davidson / qr / business_card, campaign business_card_2611;
  R-270, from Web Analytics R-267). A printed slug is never deleted, only
  re-pointed.

  a3quumsolutions.com is GitHub Pages and ignores _redirects, so A3Q short
  links are HTML stubs at /go/<slug>/. The meta refresh covers a browser with
  JavaScript off.
-->
<meta http-equiv="refresh" content="0; url=/davidson/?utm_source=davidson&amp;utm_medium=qr&amp;utm_campaign=business_card_2611&amp;utm_content=business_card" />
<script>
  location.replace('/davidson/?utm_source=davidson&utm_medium=qr&utm_campaign=business_card_2611&utm_content=business_card');
</script>
<style>
  body { background:#0D0D0D; color:#fff; font:16px/1.5 system-ui,sans-serif;
         margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
  a { color:#fff; }
</style>
</head>
<body>
  <p><a href="/davidson/?utm_source=davidson&amp;utm_medium=qr&amp;utm_campaign=business_card_2611&amp;utm_content=business_card">Continue to Bradley Davidson's card</a></p>
</body>
</html>
