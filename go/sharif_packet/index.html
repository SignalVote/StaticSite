<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Redirecting</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://a3quumsolutions.com/campus/ua/" />
<!--
  Short link printed as the QR on Rashmee Sharif's University of Alabama packet
  (Link Builder row: sharif / qr / packet, campaign campus_ua_2611; R-115, R-136).
  A printed slug is never deleted, only re-pointed.

  a3quumsolutions.com is GitHub Pages and ignores _redirects, so A3Q short links
  are HTML stubs at /go/<slug>/. The meta refresh covers a browser with
  JavaScript off.
-->
<meta http-equiv="refresh" content="0; url=/campus/ua/?utm_source=sharif&amp;utm_medium=qr&amp;utm_campaign=campus_ua_2611&amp;utm_content=packet" />
<script>
  location.replace('/campus/ua/?utm_source=sharif&utm_medium=qr&utm_campaign=campus_ua_2611&utm_content=packet');
</script>
<style>
  body { background:#0D0D0D; color:#fff; font:16px/1.5 system-ui,sans-serif;
         margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
  a { color:#fff; }
</style>
</head>
<body>
  <p><a href="/campus/ua/?utm_source=sharif&amp;utm_medium=qr&amp;utm_campaign=campus_ua_2611&amp;utm_content=packet">Continue to A3Q at the University of Alabama</a></p>
</body>
</html>
