<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Redirecting</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://a3quumsolutions.com/patel/" />
<!--
  This card moved from /adil/ to /patel/ on Oct 15 2026 (D22): a rep's path is
  now their handle. QR codes and lock-screen wallpapers printed before that still
  point here, so this page forwards them.

  Why a page and not a redirect rule: a3quumsolutions.com is served by GitHub
  Pages from the SignalVote/StaticSite repo, which honours no _redirects and no
  _headers file. The other three brands are on Cloudflare Pages and use a real
  301. This is the nearest equivalent available here.

  The query string and hash are carried across, which is what keeps a scan's
  event code attached. The meta refresh covers a browser with JavaScript off.
-->
<meta http-equiv="refresh" content="0; url=/patel/" />
<script>
  (function () {
    var to = '/patel/' + (location.search || '') + (location.hash || '');
    location.replace(to);
  })();
</script>
<style>
  body { background:#0D0D0D; color:#fff; font:16px/1.5 system-ui,sans-serif;
         margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
  a { color:#FF5A1F; }
</style>
</head>
<body>
  <p>This card now lives at <a href="/patel/">a3quumsolutions.com/patel/</a>.</p>
</body>
</html>
